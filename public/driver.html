<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Driver UI</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .container { margin-bottom: 20px; }
    input, button { display: block; margin-bottom: 10px; padding: 10px; width: 300px; }
    .booking-request { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Login</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>

  <div class="container">
    <h2>Booking Requests</h2>
    <div id="bookingRequestsOutput"></div>
  </div>

  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
  <script>
    let token = '';
    let socket;

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('http://localhost:5005/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        if (!response.ok) {
          const errText = await response.text().catch(()=>null);
          throw new Error(`HTTP error! status: ${response.status} ${errText || ''}`);
        }

        const data = await response.json();
        token = data?.data?.token;
        const userId = data?.data?.user?._id;

        if (!token || !userId) {
          alert('Login succeeded but response missing token or user id. Check server response in console.');
          console.error('Invalid login response:', data);
          return;
        }

        alert('Logged in successfully');

        // Initialize socket connection and pass token in auth (optional)
        socket = io('http://localhost:5005', {
          transports: ['websocket', 'polling'],
          auth: { token }
        });

        // Wait for connection before emitting registerDriver
        socket.on('connect', () => {
          console.log('Socket connected:', socket.id);
          socket.emit('registerDriver', userId);
        });

        socket.on('connect_error', (err) => {
          console.error('Socket connect_error:', err);
          alert('Socket connection error — check console for details');
        });

        // Listen for new bookings
socket.on('newBooking', (payload) => {
    try {
        const bookingRequestsOutput = document.getElementById('bookingRequestsOutput');
        const bookingRequest = document.createElement('div');
        bookingRequest.className = 'booking-request';
        bookingRequest.id = `booking-${payload.bookingId}`;
        bookingRequest.innerHTML = `
            <p>Booking ID: ${payload.bookingId}</p>
            <p>Source: ${payload.source?.latitude ?? '-'}, ${payload.source?.longitude ?? '-'}</p>
            <p>Destination: ${payload.destination?.latitude ?? '-'}, ${payload.destination?.longitude ?? '-'}</p>
            <p>Fare: ${payload.fare ?? '-'}</p>
            <button onclick="confirmBooking('${payload.bookingId}')">Confirm Booking</button>
        `;
        bookingRequestsOutput.appendChild(bookingRequest);
    } catch (e) {
        console.error('Error rendering booking:', e, payload);
    }
});


        // Listen for booking removal
        socket.on('removeBooking', (data) => {
          const bookingElement = document.getElementById(`booking-${data.bookingId}`);
          if (bookingElement) bookingElement.remove();
        });

        // Listen for booking confirmation
        socket.on('rideConfirmed', (data) => {
          const bookingElement = document.getElementById(`booking-${data.bookingId}`);
          if (bookingElement) {
            bookingElement.remove();
            alert(`Booking ${data.bookingId} has been confirmed by you.`);
          }
        });

      } catch (error) {
        console.error('Error during login:', error);
        alert('Login failed — check console for details.');
      }
    }

    async function confirmBooking(bookingId) {
      try {
        const response = await fetch('http://localhost:5005/api/bookings/confirm', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ bookingId })
        });

        if (!response.ok) {
          const errText = await response.text().catch(()=>null);
          throw new Error(`HTTP error! status: ${response.status} ${errText || ''}`);
        }

        const data = await response.json();
        console.log(data);
        alert('Booking confirmed: ' + JSON.stringify(data.data || data));

        const bookingElement = document.getElementById(`booking-${bookingId}`);
        if (bookingElement) bookingElement.remove();
      } catch (error) {
        console.error('Error confirming booking:', error);
        alert('Failed to confirm booking — check console for details.');
      }
    }
  </script>
</body>
</html>
